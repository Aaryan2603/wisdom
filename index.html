<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stay Free</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Stay Free">
<meta name="theme-color" content="#000000">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#000;color:#f2f2f2;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif}
  body{display:flex;flex-direction:column;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 28px) 24px calc(env(safe-area-inset-bottom) + 24px);
    min-height:100dvh}
  .top{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#777;display:flex;justify-content:space-between}
  .mid{flex:1;display:flex;flex-direction:column;justify-content:center;gap:28px}
  .ask{font-size:15px;color:#ff5a4f;letter-spacing:.04em;text-transform:uppercase;font-weight:600}
  .quote{font-size:clamp(26px,7.2vw,38px);line-height:1.22;font-weight:700;margin:0}
  .author{color:#999;font-size:16px;margin-top:-8px}
  .btns{display:flex;flex-direction:column;gap:12px}
  button{font:inherit;font-size:18px;font-weight:600;border:0;border-radius:16px;padding:18px;width:100%;cursor:pointer}
  .free{background:#f2f2f2;color:#000}
  .go{background:#161616;color:#8a8a8a}
  button:disabled{opacity:.35}
  .done{text-align:center;gap:14px}
  .big{font-size:64px;font-weight:800}
  .hidden{display:none}
</style>
</head>
<body>
  <div class="top"><span>Stay Free</span><span id="count"></span></div>

  <div class="mid" id="main">
    <div class="ask">What are you giving up right now?</div>
    <p class="quote" id="q"></p>
    <div class="author" id="a"></div>
  </div>

  <div class="mid done hidden" id="result">
    <div class="big" id="rbig"></div>
    <p class="quote" id="rmsg" style="font-size:24px"></p>
    <div class="author" id="rsub"></div>
  </div>

  <div class="btns" id="btns">
    <button class="free" id="free" disabled>Stay free</button>
    <button class="go" id="go" disabled>I'll continue anyway</button>
  </div>

<script>
const QUOTES = [
 ["Stay hard.","David Goggins"],
 ["You are in danger of living a life so comfortable and soft that you will die without ever realizing your true potential.","David Goggins"],
 ["Don't stop when you're tired. Stop when you're done.","David Goggins"],
 ["Suffering is the true test of life.","David Goggins"],
 ["Discipline equals freedom.","Jocko Willink"],
 ["Don't expect to be motivated every day. Learn to be disciplined.","Jocko Willink"],
 ["Desire is a contract you make with yourself to be unhappy until you get what you want.","Naval Ravikant"],
 ["Earn with your mind, not your time.","Naval Ravikant"],
 ["You have power over your mind, not outside events. Realize this, and you will find strength.","Marcus Aurelius"],
 ["Waste no more time arguing what a good man should be. Be one.","Marcus Aurelius"],
 ["The impediment to action advances action. What stands in the way becomes the way.","Marcus Aurelius"],
 ["It is not that we have a short time to live, but that we waste a lot of it.","Seneca"],
 ["We suffer more often in imagination than in reality.","Seneca"],
 ["No man is free who is not master of himself.","Epictetus"],
 ["First say to yourself what you would be; and then do what you have to do.","Epictetus"],
 ["Man is not worried by real problems so much as by his imagined anxieties about real problems.","Epictetus"],
 ["He who has a why to live can bear almost any how.","Friedrich Nietzsche"],
 ["Everything can be taken from a man but one thing: the last of the human freedoms, to choose one's attitude.","Viktor Frankl"],
 ["How we spend our days is, of course, how we spend our lives.","Annie Dillard"],
 ["Lost time is never found again.","Benjamin Franklin"],
 ["Either you run the day, or the day runs you.","Jim Rohn"],
 ["Discipline is choosing between what you want now and what you want most.","Abraham Lincoln (attributed)"],
 ["The successful warrior is the average man, with laser-like focus.","Bruce Lee"],
 ["You will never always be motivated, so you must learn to be disciplined.","Anonymous"],
 ["Every minute you scroll is a minute somebody else is building their life. Are you building yours?","Remember this"],
 ["Your attention is the most valuable thing you own. They are paying to take it. Why give it away free?","Remember this"],
 ["In five years, you won't remember this scroll. You will remember what you built instead.","Remember this"]
];

const $=id=>document.getElementById(id);
const get=(k)=>{try{return parseInt(localStorage.getItem(k)||"0",10)}catch(e){return 0}};
const set=(k,v)=>{try{localStorage.setItem(k,String(v))}catch(e){}};

const today=new Date().toISOString().slice(0,10);
if((()=>{try{return localStorage.getItem("day")}catch(e){return null}})()!==today){
  try{localStorage.setItem("day",today)}catch(e){}
  set("todayFree",0);set("todayGave",0);
}
function renderCount(){$("count").textContent="Resisted today: "+get("todayFree")+" · Total: "+get("free")}
renderCount();

const [q,a]=QUOTES[Math.floor(Math.random()*QUOTES.length)];
$("q").textContent=q; $("a").textContent="— "+a;

// 5-second pause so you actually read it
let t=5;
$("free").textContent="Stay free ("+t+")";
const timer=setInterval(()=>{
  t--;
  if(t<=0){
    clearInterval(timer);
    $("free").disabled=false;$("go").disabled=false;
    $("free").textContent="Stay free";
  } else $("free").textContent="Stay free ("+t+")";
},1000);

function showResult(big,msg,sub){
  $("main").classList.add("hidden");$("btns").classList.add("hidden");
  $("result").classList.remove("hidden");
  $("rbig").textContent=big;$("rmsg").textContent=msg;$("rsub").textContent=sub;
  renderCount();
}
$("free").onclick=()=>{
  set("free",get("free")+1);set("todayFree",get("todayFree")+1);
  showResult("✓","Good. That's one more win.","Lock your phone, or go do something real.");
};
$("go").onclick=()=>{
  set("gave",get("gave")+1);set("todayGave",get("todayGave")+1);
  showResult("…","Your call. Just be honest about what it costs you.","Times you gave in today: "+get("todayGave")+". Switch back to the app if you must.");
};

if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>
</body>
</html>
